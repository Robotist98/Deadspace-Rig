; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp12e

[env]
platform = espressif8266
board = esp12e
framework = arduino
monitor_speed = 115200
; Compatible with the installed ESP8266 Arduino 2.7.4 toolchain.
lib_deps =
    fastled/FastLED@3.6.0
; Use actual GPIO numbers: 5 means IO5 (NodeMCU D1), not NodeMCU D5.
build_flags =
    -DFASTLED_ESP8266_RAW_PIN_ORDER

; First flash (USB), or recovery if Wi-Fi credentials change.
[env:esp12e]
upload_protocol = esptool

; Subsequent flashes over Wi-Fi, using the password in include/config.h.
[env:esp12e_ota]
upload_protocol = espota
upload_port = deadspace-leds.local
extra_scripts = post:scripts/ota_upload.py
; Fixed TCP callback port on the computer, for a narrow firewall exception.
upload_flags =
    --host_port=8267
